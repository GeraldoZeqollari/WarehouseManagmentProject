server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/warehouse?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME:warehouse_db}
    password: ${DB_PASSWORD:warehouse}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:}
  validity-sec: 50
  refresh-ttl: 604800
  claim-roles: roles

jobs:
  delivery-scheduler-cron: "0 0 12 * * *"


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor: trace
